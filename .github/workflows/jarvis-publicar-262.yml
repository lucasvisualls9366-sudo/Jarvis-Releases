name: JARVIS 2.1.262 - solicitar publicacao oficial validada
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jarvis-publicar-261.yml
permissions:
  contents: read
  actions: write
jobs:
  solicitar-publicacao:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir versao, notas e solicitar build Windows oficial
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ secrets.JARVIS_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          LATEST=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          if [[ "$LATEST" == "v2.1.262" ]]; then
            echo "::notice::JARVIS 2.1.262 ja publicado."
            exit 0
          fi
          if [[ "$LATEST" != "v2.1.261" ]]; then
            echo "::error::Versao publica inesperada: $LATEST."
            exit 1
          fi
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "::error::Falta segredo JARVIS_SOURCE_TOKEN."
            exit 1
          fi
          SOURCE_REPO="lukasvisualls-dev/Jarvis"
          VERSION=$(GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPO/contents/package.json?ref=main" --jq .content | base64 --decode | jq -r .version)
          if [[ "$VERSION" != "2.1.262" ]]; then
            echo "::error::Fonte $VERSION diverge de 2.1.262."
            exit 1
          fi
          GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPO/contents/release-trigger/2.1.262.md?ref=main" >/dev/null
          gh workflow run jarvis-windows-cloud.yml --repo "$REPO" --ref main -f publicar=true
          echo "::notice::Publicacao 2.1.262 solicitada: ainda depende dos testes Windows, build e validacao dos assets."
