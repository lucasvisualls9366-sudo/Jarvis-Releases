name: Validar JARVIS 2.1.258 - holograma realista e voz
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validar-holograma-258.yml
  workflow_dispatch:

permissions:
  contents: read
jobs:
  validar-holograma:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar codigo privado do PR 193
        uses: actions/checkout@v4
        with:
          repository: lukasvisualls-dev/Jarvis
          ref: eeff5840b0480aa98e7d74858bb2f01ba6bc668f
          token: ${{ secrets.JARVIS_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias com tolerancia a rede instavel
        shell: bash
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          for attempt in 1 2 3 4; do
            npm ci --fetch-retries=4 --fetch-retry-factor=2 --fetch-retry-mintimeout=2000 && exit 0
            echo "npm ci falhou na tentativa $attempt; repetindo..."
            sleep 5
          done
          exit 1
      - name: Conferir regressao e novo holograma
        run: |
          test "$(node -p "require('./package.json').version")" = "2.1.258"
          npm run test:holograma-256
          npm run test:holograma-257
          npm run test:holograma-258
      - name: Compilar aplicativo React
        run: npm run build
      - name: Checar TypeScript
        run: npx tsc -p tsconfig.app.json
