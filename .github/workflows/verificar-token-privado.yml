name: Diagnostico seguro - token do codigo privado

# Dispara ao instalar este teste ou manualmente. Nunca em PRs.
# Sem compilacao, sem releases, sem imprimir o token ou dados do codigo privado.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verificar-token-privado.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-acesso:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validar JARVIS_SOURCE_TOKEN sem expor credencial
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.JARVIS_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::JARVIS_SOURCE_TOKEN nao esta cadastrado em Jarvis-Releases."
            exit 1
          fi
          if GH_TOKEN="$PRIVATE_TOKEN" gh api repos/lukasvisualls-dev/Jarvis/commits/main --jq '.sha' >/dev/null 2>&1; then
            echo "TOKEN_PRIVADO_OK: acesso de leitura ao codigo JARVIS confirmado."
          else
            echo "::error::Token existe, mas nao conseguiu ler lukasvisualls-dev/Jarvis."
            exit 1
          fi
      - name: Verificar sintaxe PowerShell do backup antes da formatacao
        shell: pwsh
        env:
          PRIVATE_TOKEN: ${{ secrets.JARVIS_SOURCE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'Preparar-Formatacao-JARVIS.ps1'
          $env:GH_TOKEN = $env:PRIVATE_TOKEN
          $base64 = (gh api repos/lukasvisualls-dev/Jarvis/contents/scripts/Preparar-Formatacao-JARVIS.ps1 --jq .content) -join ''
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao baixar o script privado.' }
          [IO.File]::WriteAllBytes($tmp, [Convert]::FromBase64String($base64))
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($tmp, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            foreach ($erro in $parseErrors) { Write-Error $erro.Message }
            throw 'O script de backup possui erro de sintaxe.'
          }
          Write-Host 'SCRIPT_BACKUP_SINTAXE_OK'
